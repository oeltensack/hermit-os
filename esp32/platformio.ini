; Pagurus OS fuer ESP32 – Klimaanlagen am UART des WLAN-Moduls
;   tclac     TCL/Kesser am ESP32 (mit DHT22)       -> .pio/build/tclac/firmware.bin
;   midea_c3  Midea/Dimstal & Co. am ESP32-C3       -> .pio/build/midea_c3/firmware.bin
; Bauen: pio run   (beide)   bzw.  pio run -e midea_c3
; Erstes Aufspielen per Kabel: pio run -e midea_c3 -t upload --upload-port COM5
[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
extra_scripts = pre:gzip_ui.py
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    knolleary/PubSubClient@^2.8
build_flags =
    -DFW_VERSION=\"1.19.4\"
    -DCORE_DEBUG_LEVEL=0

[env:tclac]
board = esp32dev
lib_deps =
    ${env.lib_deps}
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
build_flags = ${env.build_flags}

; Protokoll aus dudanov/MideaUART (MIT) – dieselbe Bibliothek wie in ESPHome (platform: midea).
; Serial = USB, die Anlage haengt an UART1 auf den UART0-Pins GPIO21/GPIO20.
[env:midea_c3]
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
lib_deps =
    ${env.lib_deps}
    dudanov/MideaUART@1.1.9
build_flags = ${env.build_flags} -DAC_MIDEA -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
