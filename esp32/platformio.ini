; Pagurus OS fuer ESP32 – TCL-/Kesser-Klimaanlage
; Bauen: pio run   (Ergebnis: .pio/build/tclac/firmware.bin)
; Erstes Aufspielen per Kabel: pio run -t upload --upload-port COM5
[env:tclac]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    knolleary/PubSubClient@^2.8
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
build_flags =
    -DFW_VERSION=\"1.18.1\"
    -DCORE_DEBUG_LEVEL=0
