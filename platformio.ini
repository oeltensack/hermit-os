; Pagurus OS – eigene Firmware fuer alte Shelly 1 / Shelly 1PM (ESP8266, 2 MB Flash)
; Bauen:   pio run -e shelly1     bzw.  pio run -e shelly1pm
; Flashen: pio run -e shelly1pm -t upload --upload-port /dev/ttyUSB0

[platformio]
default_envs = shelly1, shelly1pm, shelly1_addon, shelly1pm_addon, plugs, plug, duo, dimmer2, shelly25, shelly25_cover, shelly1pm_meter, plugs_meter, plug_meter, rfbridge, plug1m, loader, loader_1m, loader_1m_plug1m

[env]
platform = espressif8266
board = esp12e
framework = arduino
board_build.flash_mode = dout
board_build.ldscript = eagle.flash.2m256.ld
board_build.filesystem = littlefs
board_upload.flash_size = 2MB
board_upload.maximum_size = 1044464
upload_speed = 115200
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    knolleary/PubSubClient@^2.8
build_flags =
    -DFW_VERSION=\"1.18.5\"
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY

[env:shelly1]
build_flags = ${env.build_flags} -DDEVICE_SHELLY1

[env:shelly1pm]
build_flags = ${env.build_flags} -DDEVICE_SHELLY1PM

[env:plugs]
build_flags = ${env.build_flags} -DDEVICE_PLUGS

[env:plug]
build_flags = ${env.build_flags} -DDEVICE_PLUG

[env:duo]
build_flags = ${env.build_flags} -DDEVICE_DUO

; Sonoff RF Bridge: 1 MB Flash (64 KB Dateisystem). Updates kommen gepackt (.bin.gz), damit sie passen.
[env:rfbridge]
board = esp8285
board_build.ldscript = eagle.flash.1m64.ld
board_upload.flash_size = 1MB
board_upload.maximum_size = 958448
build_flags = ${env.build_flags} -DDEVICE_RFBRIDGE

; Einfache 1-MB-Steckdose (ESP8285, Touch-Taste, ohne Messung) – gleiches Layout wie die RF Bridge
[env:plug1m]
board = esp8285
board_build.ldscript = eagle.flash.1m64.ld
board_upload.flash_size = 1MB
board_upload.maximum_size = 958448
build_flags = ${env.build_flags} -DDEVICE_PLUG1M

[env:shelly25]
build_flags = ${env.build_flags} -DDEVICE_SHELLY25

[env:shelly25_cover]
build_flags = ${env.build_flags} -DDEVICE_SHELLY25 -DCOVER_MODE

[env:dimmer2]
build_flags = ${env.build_flags} -DDEVICE_DIMMER2

; Messfirmware: nur Energiemessung, Relais bleibt an, Reset nach Ueberlast nur am Taster/SW
[env:shelly1pm_meter]
build_flags = ${env.build_flags} -DDEVICE_SHELLY1PM -DMETER_ONLY

[env:plugs_meter]
build_flags = ${env.build_flags} -DDEVICE_PLUGS -DMETER_ONLY

[env:plug_meter]
build_flags = ${env.build_flags} -DDEVICE_PLUG -DMETER_ONLY

; Varianten mit Shelly-Temperatur-Add-on als externem Tastereingang (input:100)
[env:shelly1_addon]
build_flags = ${env.build_flags} -DDEVICE_SHELLY1 -DWITH_ADDON

[env:shelly1pm_addon]
build_flags = ${env.build_flags} -DDEVICE_SHELLY1PM -DWITH_ADDON

; Pagurus Loader: kleine Zwischen-Firmware fuer den direkten Wechsel Tasmota -> Pagurus OS
[env:loader]
lib_deps =
build_flags = ${env.build_flags} -DHERMIT_LOADER -Os

; Pagurus Loader fuer 1-MB-Geraete (RF Bridge): Zwischenstufe beim Update und beim Wechsel von Tasmota.
; Gleiches Flash-Layout wie rfbridge, damit die Pagurus-Einstellungen (LittleFS) erhalten bleiben.
[env:loader_1m]
; eigene build_flags (lwIP ohne Extras, spart Platz) – FW_VERSION hier mit anheben
board = esp8285
board_build.ldscript = eagle.flash.1m64.ld
board_upload.flash_size = 1MB
board_upload.maximum_size = 958448
lib_deps =
build_flags = -DFW_VERSION=\"1.18.5\" -DPIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH_LOW_FLASH -DHERMIT_LOADER -DLOADER_AUTO -DLOADER_VARIANT=\"hermit-rfbridge\" -Os

; Loader fuer die 1-MB-Steckdose: installiert beim Wechsel (Tasmota/ESPHome) hermit-plug1m statt der RF-Bridge-Firmware
[env:loader_1m_plug1m]
board = esp8285
board_build.ldscript = eagle.flash.1m64.ld
board_upload.flash_size = 1MB
board_upload.maximum_size = 958448
lib_deps =
build_flags = -DFW_VERSION=\"1.18.5\" -DPIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH_LOW_FLASH -DHERMIT_LOADER -DLOADER_AUTO -DLOADER_VARIANT=\"hermit-plug1m\" -Os
