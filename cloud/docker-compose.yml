# Pagurus Cloud – Heim-Cloud fuer Pagurus OS und Shelly Gen2+
# Start (im Ordner cloud/):  cp .env.example .env  (Werte anpassen)  &&  docker compose up -d
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: hermit-mosquitto
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/hermit/entrypoint.sh"]
    environment:
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASS: ${MQTT_PASS:-}
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto:/hermit:ro
      - mosquitto-data:/mosquitto/data

  cloud:
    build: ./app
    image: hermit-cloud:latest
    container_name: hermit-cloud
    restart: unless-stopped
    depends_on: [mosquitto]
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASS: ${MQTT_PASS:-}
      CLOUD_PASSWORD: ${CLOUD_PASSWORD:-}
      PUBLIC_BROKER: ${PUBLIC_BROKER:-}
      PORTAL_URL: ${PORTAL_URL:-}
      PORTAL_TOKEN: ${PORTAL_TOKEN:-}
      TZ: ${TZ:-Europe/Berlin}
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - ./data:/data

  # Optional: eigener Push-Server (ntfy). Start mit:  docker compose --profile ntfy up -d
  # In der Cloud dann als ntfy-Adresse  http://<IP>:8090/<thema>  eintragen und in der ntfy-App
  # diesen Server hinzufuegen.
  ntfy:
    image: binwiederhier/ntfy
    container_name: hermit-ntfy
    profiles: ["ntfy"]
    restart: unless-stopped
    command: serve
    environment:
      TZ: ${TZ:-Europe/Berlin}
    ports:
      - "8090:80"
    volumes:
      - ntfy-cache:/var/cache/ntfy

  # Updater: installiert Cloud-Updates (Knopf in der Oberflaeche oder automatisch).
  # Braucht Zugriff auf Docker und auf den Repo-Ordner. Wer das nicht will: Dienst auskommentieren
  # und von Hand aktualisieren (git pull && docker compose up -d --build).
  updater:
    build: ./updater
    image: hermit-cloud-updater:latest
    container_name: hermit-cloud-updater
    restart: unless-stopped
    command: ["sh", "${PWD}/updater/update.sh"]
    environment:
      HERMIT_CLOUD_DIR: ${PWD}
    working_dir: ${PWD}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}/..:${PWD}/..

volumes:
  mosquitto-data:
  ntfy-cache:
