# Hermit Cloud – Heim-Cloud fuer Hermit OS und Shelly Gen2+
# Start:  cp .env.example .env  (Werte anpassen)  &&  docker compose up -d
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: hermit-mosquitto
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/hermit/entrypoint.sh"]
    environment:
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASS: ${MQTT_PASS:-}
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto:/hermit:ro
      - mosquitto-data:/mosquitto/data

  cloud:
    build: ./app
    image: hermit-cloud:latest
    container_name: hermit-cloud
    restart: unless-stopped
    depends_on: [mosquitto]
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASS: ${MQTT_PASS:-}
      CLOUD_PASSWORD: ${CLOUD_PASSWORD:-}
      PUBLIC_BROKER: ${PUBLIC_BROKER:-}
      TZ: ${TZ:-Europe/Berlin}
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - ./data:/data

volumes:
  mosquitto-data:
